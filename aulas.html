<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Aulas · Publi Advisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0D0B; --surface:#141310; --surface-alt:#1B1916;
  --border:rgba(243,239,229,.14); --border-strong:rgba(243,239,229,.30);
  --text:#F3EFE5; --text-muted:#9A9384; --text-faint:#6E685C;
  --accent:#E5322B; --accent-soft:#2A0F0D; --ink:#E5322B;
  --green:#8FB069; --green-soft:#16210F;
  --serif:'Fraunces',Georgia,serif; --mono:'Space Mono','SFMono-Regular',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
input,textarea{color:var(--text);font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--text-faint);opacity:1}
.hidden{display:none!important}
a{color:var(--accent)}
.link{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline;padding:0}
.loading{color:var(--text-faint);font-size:14px;padding:40px 4px}
.note{font-size:12.5px;color:var(--text-faint)}

/* ===== LOGIN ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 80% -10%, #19090c 0%, transparent 60%), var(--bg)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.brand{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-weight:700}
.login-card h1{font-size:26px;font-weight:900;margin:8px 0 4px;font-family:var(--serif)}
.login-card .sub{color:var(--text-muted);font-size:13.5px;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:600;margin-bottom:6px}
.field input{width:100%;padding:12px 14px;background:var(--surface-alt);border:1px solid var(--border-strong);border-radius:8px;font-size:15px}
.field input:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.btn-main{width:100%;padding:13px;margin-top:6px;background:var(--ink);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-main:hover{filter:brightness(1.08)}
.btn-main:disabled{opacity:.5;cursor:default}
.login-err{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
.login-err.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.login-card .hint{margin-top:16px;font-size:12px;color:var(--text-muted);text-align:center;line-height:1.7}

/* ===== TOPBAR + WRAP ===== */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 22px;background:rgba(20,19,16,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.tb-brand{font-size:14px;font-weight:800;letter-spacing:.01em}
.tb-brand .m{color:var(--accent)}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-user{font-size:12.5px;color:var(--text-muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-btn{background:transparent;border:1px solid var(--border-strong);color:var(--text-muted);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.tb-btn:hover{border-color:var(--accent);color:var(--text)}
.wrap{max-width:1120px;margin:0 auto;padding:26px 22px 60px}
.page-head{margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.page-head h1{font-size:26px;font-weight:900;font-family:var(--serif)}
.page-head .psub{font-size:12.5px;color:var(--text-faint);margin-top:3px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* ===== Aulas gravadas (curso em vídeo) ===== */
.course-wrap{display:grid;grid-template-columns:1fr 360px;gap:26px;align-items:start}
.course-progress{margin-bottom:22px}
.course-progress .cp-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--text-muted);margin-bottom:7px}
.course-progress .cp-top b{color:var(--text);font-weight:800}
.cp-bar{height:8px;border-radius:99px;background:var(--surface-alt);overflow:hidden}
.cp-bar>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.course-player{background:#000;border:1px solid var(--border);border-radius:14px;overflow:hidden;position:relative;aspect-ratio:16/9}
.course-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.course-player .cp-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:14px;text-align:center;padding:24px}
.course-now{margin-top:17px}
.course-now .cn-mod{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.course-now h2{font-size:22px;font-weight:900;margin:5px 0 9px;line-height:1.2;font-family:var(--serif)}
.course-now .cn-desc{font-size:14px;line-height:1.7;color:var(--text-muted)}
.course-now .cn-actions{margin-top:15px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cn-mark{background:var(--ink);color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.cn-mark:hover{filter:brightness(1.08)}
.cn-mark.done{background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.course-list{display:flex;flex-direction:column;gap:18px}
.cl-mod .clm-h{font-size:12.5px;font-weight:800;letter-spacing:.01em;color:var(--text);margin-bottom:9px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cl-mod .clm-h small{color:var(--text-faint);font-weight:600;font-family:var(--mono);font-size:11px}
.cl-item{display:flex;gap:11px;align-items:center;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;margin-bottom:7px;transition:border-color .15s,background .15s}
.cl-item:hover{border-color:var(--border-strong)}
.cl-item.active{border-color:var(--accent);background:var(--accent-soft)}
.cl-tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .15s}
.cl-item.done .cl-tick{background:var(--green);border-color:var(--green);color:#0E0D0B}
.cl-meta{min-width:0;flex:1}
.cl-meta .clt{font-size:13.5px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-meta .cld{font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-top:2px}
.cl-item.active .clt{color:var(--accent)}
.course-empty{text-align:center;padding:60px 20px;color:var(--text-faint)}
.course-empty .ce-ic{font-size:38px;margin-bottom:12px}
/* editor de aulas (mentor) */
.okr-addobj{background:transparent;border:1px dashed var(--border-strong);color:var(--text-muted);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.okr-addobj:hover{border-color:var(--accent);color:var(--text)}
.ck-mod{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;background:var(--surface)}
.ck-modhd{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ck-lesson{border:1px dashed var(--border-strong);border-radius:10px;padding:12px;margin:11px 0;background:var(--bg)}
.ck-lrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ck-f{width:100%;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-family:inherit;font-size:13.5px;margin-top:7px}
.ck-lrow .ck-f{flex:1;min-width:130px;margin-top:0}
textarea.ck-f{min-height:56px;resize:vertical;line-height:1.5}
.ck-f:focus{outline:none;border-color:var(--accent)}
.ck-x{background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:7px;width:34px;height:34px;cursor:pointer;flex-shrink:0;font-size:14px}
.ck-x:hover{border-color:var(--accent);color:var(--accent)}
.ck-hint{font-size:11.5px;color:var(--text-faint);margin-top:5px}
.save-bar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 32%);padding:18px 0 6px;display:flex;align-items:center;gap:14px;margin-top:6px}
.save-bar button{background:var(--ink);color:#fff;border:none;border-radius:9px;padding:13px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.save-bar button:hover{filter:brightness(1.08)} .save-bar button:disabled{opacity:.5;cursor:default}
.save-msg{font-size:13px}.save-msg.ok{color:var(--green)}.save-msg.err{color:var(--accent)}
@media(max-width:860px){ .course-wrap{grid-template-columns:1fr} }
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div id="loginPanel">
      <div class="brand">Área de aulas</div>
      <h1>Publi Advisor</h1>
      <div class="sub">Aulas gravadas da mentoria</div>
      <div id="loginErr" class="login-err hidden"></div>
      <div class="field"><label>E-mail</label>
        <input type="email" id="email" placeholder="voce@email.com" autocomplete="username"></div>
      <div class="field"><label>Senha</label>
        <input type="password" id="password" placeholder="sua senha" autocomplete="current-password"></div>
      <button class="btn-main" id="loginBtn">Entrar →</button>
      <div class="hint">Use o e-mail e a senha que você recebeu.<br><button type="button" class="link" id="toggleChange">Mudar minha senha</button></div>
    </div>
    <div id="changePanel" class="hidden">
      <div class="brand">Mudar minha senha</div>
      <h1>Nova senha</h1>
      <div class="sub">Entre com a senha atual e escolha uma nova.</div>
      <div id="changeErr" class="login-err hidden"></div>
      <div class="field"><label>E-mail</label><input type="email" id="chgEmail" placeholder="voce@email.com" autocomplete="username"></div>
      <div class="field"><label>Senha atual</label><input type="password" id="chgCurrent" placeholder="senha atual" autocomplete="current-password"></div>
      <div class="field"><label>Nova senha</label><input type="password" id="chgNew" placeholder="mínimo 6 caracteres" autocomplete="new-password"></div>
      <div class="field"><label>Confirmar nova senha</label><input type="password" id="chgConfirm" placeholder="repita a nova senha" autocomplete="new-password"></div>
      <button class="btn-main" id="chgBtn">Salvar nova senha</button>
      <div class="hint"><button type="button" class="link" id="toggleBackLogin">← Voltar ao login</button></div>
    </div>
  </div>
</div>

<!-- ========== APP (só o curso) ========== -->
<div id="appScreen" class="hidden">
  <header class="topbar">
    <div class="tb-brand">🎬 Aulas <span class="m">·</span> Publi Advisor</div>
    <div class="tb-right">
      <span id="tbUser" class="tb-user"></span>
      <button id="editToggle" class="tb-btn hidden">✏️ Editar aulas</button>
      <button id="logoutBtn" class="tb-btn">Sair</button>
    </div>
  </header>
  <main id="main" class="wrap"><div class="loading">Carregando…</div></main>
</div>

<script>
const SUPABASE_URL = "https://ywamkvmlspmposatzyhp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3YW1rdm1sc3BtcG9zYXR6eWhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTg4MzAsImV4cCI6MjA5NDkzNDgzMH0.T0OS8sxEdsdSr4oiAg881FKO90CfY2-cIvl5ibQGPHQ";
const SESSION_KEY = "aulas-session";
const MENTOR_EMAIL = "caiobocuti@catalunyafilmes.com";

let USER_EMAIL=null, _authToken=null, IS_MENTOR=false;

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

// ===== AUTH (sem exigir "código de produtora": serve pra qualquer mentorado) =====
function getSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||"null"); }catch(e){ return null; } }
function setSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem(SESSION_KEY); }
function applySession(s){ USER_EMAIL=s.email||null; _authToken=s.access_token||null; IS_MENTOR=(s.email===MENTOR_EMAIL); return s; }

async function login(email, password){
  const r = await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password", {
    method:"POST", headers:{ "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ email, password }) });
  const j = await r.json();
  if(!r.ok){ throw new Error(j.error_description || j.msg || j.error || ("Falha no login ("+r.status+")")); }
  const sess = { access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Date.now()+(j.expires_in||3600)*1000, email: (j.user&&j.user.email)||email };
  setSession(sess); return applySession(sess);
}
async function refreshSession(){
  const s=getSession(); if(!s||!s.refresh_token) return null;
  const r = await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token", {
    method:"POST", headers:{ "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ refresh_token:s.refresh_token }) });
  if(!r.ok){ clearSession(); return null; }
  const j = await r.json();
  const sess = { access_token:j.access_token, refresh_token:j.refresh_token||s.refresh_token, expires_at: Date.now()+(j.expires_in||3600)*1000, email:(j.user&&j.user.email)||s.email };
  setSession(sess); return applySession(sess);
}
async function validToken(){ let s=getSession(); if(!s) return null; if(Date.now() > s.expires_at - 60000){ s = await refreshSession(); } if(s) applySession(s); return s; }

// Login automático via link do Catalunya OS (#access_token) e ?email= pré-preenchido
async function trySsoFromHash(){
  try{
    if(!location.hash || location.hash.indexOf("access_token") < 0) return false;
    const h = new URLSearchParams(location.hash.replace(/^#/,""));
    const at = h.get("access_token"), rt = h.get("refresh_token");
    if(!at) return false;
    const payload = JSON.parse(atob(at.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
    setSession({ access_token:at, refresh_token:rt, expires_at: Date.now() + ((parseInt(h.get("expires_in"),10)||3600)*1000), email: payload.email||"" });
    applySession(getSession());
    history.replaceState(null, "", location.pathname + location.search);
    return true;
  }catch(e){ return false; }
}
function prefillEmailFromQuery(){
  try{
    const qp = new URLSearchParams(location.search).get("email");
    const el = document.getElementById("email");
    if(qp && el && !el.value){ el.value = qp; }
    const em = el ? el.value : "";
    setTimeout(()=>{ const f = document.getElementById(em ? "password" : "email"); if(f) f.focus(); }, 60);
  }catch(e){}
}

// ===== CURSO (conteúdo GLOBAL, mesma tabela do portal) =====
let COURSE=null, _courseSel=null, _courseEdit=null;
function courseDoneKey(){ return "pa-aulas-done:"+(USER_EMAIL||"anon"); }
function courseGetDone(){ try{ return new Set(JSON.parse(localStorage.getItem(courseDoneKey())||"[]")); }catch(e){ return new Set(); } }
function courseSetDone(set){ try{ localStorage.setItem(courseDoneKey(), JSON.stringify([...set])); }catch(e){} }
function vimeoEmbed(raw){
  if(!raw) return null;
  const s=String(raw).trim(); let h=null, id=null;
  const hm=s.match(/[?&]h=([a-zA-Z0-9]+)/); if(hm) h=hm[1];
  const m=s.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([a-zA-Z0-9]+))?/);
  if(m){ id=m[1]; if(m[2]&&!h) h=m[2]; } else if(/^\d+$/.test(s)) id=s;
  if(!id) return null;
  return "https://player.vimeo.com/video/"+id+(h?("?h="+h):"");
}
async function loadCourse(force){
  if(COURSE && !force) return COURSE;
  try{
    let token=_authToken; if(!token){ const s=await validToken(); token=s&&s.access_token; }
    const r=await fetch(SUPABASE_URL+"/rest/v1/course?id=eq.1&select=data",{ headers:{ "apikey":SUPABASE_ANON_KEY, "Authorization":"Bearer "+token } });
    if(r.ok){ const j=await r.json(); COURSE=(j&&j[0]&&j[0].data)||{modulos:[]}; } else COURSE={modulos:[]};
  }catch(e){ COURSE={modulos:[]}; }
  if(!COURSE.modulos) COURSE.modulos=[];
  return COURSE;
}
function courseAllLessons(){ const out=[]; (COURSE.modulos||[]).forEach((m,mi)=>(m.aulas||[]).forEach((a,li)=>out.push({m,a,mi,li}))); return out; }

// ---- tela do aluno ----
async function showCurso(){
  document.getElementById("main").innerHTML='<div class="page-head"><h1>Aulas gravadas</h1><div class="psub">As gravações das aulas da mentoria — assista no seu ritmo</div></div><div id="courseRoot"><div class="loading">Carregando aulas…</div></div>';
  await loadCourse();
  const all=courseAllLessons();
  if(all.length){ const done=courseGetDone(); const pick=all.find(x=>!done.has(x.a.id))||all[0]; _courseSel={mi:pick.mi,li:pick.li}; } else _courseSel=null;
  renderCourse();
}
function renderCourse(){
  const root=document.getElementById("courseRoot"); if(!root) return;
  const mods=COURSE.modulos||[], all=courseAllLessons();
  const editBtn = IS_MENTOR ? '<button class="cn-mark" style="background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)" onclick="showEditor()">✏️ Editar aulas</button>' : '';
  if(!all.length){
    root.innerHTML='<div class="course-empty"><div class="ce-ic">🎬</div><div>As aulas gravadas ainda não foram publicadas.<br>Assim que as gravações forem enviadas, elas aparecem aqui.</div>'+(editBtn?('<div style="margin-top:18px">'+editBtn+'</div>'):'')+'</div>';
    return;
  }
  const done=courseGetDone();
  const doneCount=all.filter(x=>done.has(x.a.id)).length, pct=Math.round(doneCount/all.length*100);
  const sel=_courseSel?(mods[_courseSel.mi]&&mods[_courseSel.mi].aulas&&mods[_courseSel.mi].aulas[_courseSel.li]):null;
  const selMod=_courseSel?mods[_courseSel.mi]:null;
  const embed=sel?vimeoEmbed(sel.vimeo):null;
  const player=embed
    ? '<div class="course-player"><iframe src="'+embed+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>'
    : '<div class="course-player"><div class="cp-empty">'+(sel?'Vídeo ainda não configurado para esta aula.':'Selecione uma aula ao lado para começar.')+'</div></div>';
  const isDone=sel&&done.has(sel.id);
  const now=sel?(
    '<div class="course-now"><div class="cn-mod">'+esc((selMod&&selMod.titulo)||'')+'</div><h2>'+esc(sel.titulo||'Aula')+'</h2>'
    +(sel.desc?'<div class="cn-desc">'+esc(sel.desc)+'</div>':'')
    +'<div class="cn-actions"><button class="cn-mark'+(isDone?' done':'')+'" data-course-toggle="'+esc(sel.id)+'">'+(isDone?'✓ Assistida':'Marcar como assistida')+'</button>'+editBtn+'</div></div>'
  ):'';
  const list=mods.map((m,mi)=>{
    const items=(m.aulas||[]).map((a,li)=>{
      const active=_courseSel&&_courseSel.mi===mi&&_courseSel.li===li;
      return '<div class="cl-item'+(active?' active':'')+(done.has(a.id)?' done':'')+'" data-course-play="'+mi+'-'+li+'" data-lesson-id="'+esc(a.id)+'"><div class="cl-tick">✓</div><div class="cl-meta"><div class="clt">'+esc(a.titulo||'Aula')+'</div>'+(a.dur?'<div class="cld">'+esc(a.dur)+'</div>':'')+'</div></div>';
    }).join('')||'<div style="color:var(--text-faint);font-size:12.5px;padding:2px 2px 4px">Sem aulas neste módulo.</div>';
    const mdone=(m.aulas||[]).filter(a=>done.has(a.id)).length;
    return '<div class="cl-mod" data-mi="'+mi+'"><div class="clm-h"><span>'+esc(m.titulo||'Módulo')+'</span><small>'+mdone+'/'+((m.aulas||[]).length)+'</small></div>'+items+'</div>';
  }).join('');
  root.innerHTML=
    '<div class="course-progress"><div class="cp-top"><span>Seu progresso</span><span class="cp-count"><b>'+doneCount+'</b> de '+all.length+' aulas · '+pct+'%</span></div><div class="cp-bar"><span style="width:'+pct+'%"></span></div></div>'
    +'<div class="course-wrap"><div class="course-main">'+player+now+'</div><div class="course-list">'+list+'</div></div>';
}
function courseRefreshDoneUI(){
  const done=courseGetDone(), all=courseAllLessons();
  document.querySelectorAll("#courseRoot .cl-item").forEach(el=>{ el.classList.toggle("done", done.has(el.dataset.lessonId)); });
  (COURSE.modulos||[]).forEach((m,mi)=>{ const s=document.querySelector('#courseRoot .cl-mod[data-mi="'+mi+'"] small'); if(s) s.textContent=(m.aulas||[]).filter(a=>done.has(a.id)).length+'/'+((m.aulas||[]).length); });
  const dc=all.filter(x=>done.has(x.a.id)).length, pct=all.length?Math.round(dc/all.length*100):0;
  const b=document.querySelector("#courseRoot .cp-bar>span"); if(b) b.style.width=pct+"%";
  const c=document.querySelector("#courseRoot .cp-count"); if(c) c.innerHTML='<b>'+dc+'</b> de '+all.length+' aulas · '+pct+'%';
}

// ---- editor do mentor ----
async function showEditor(){
  document.getElementById("main").innerHTML='<div class="page-head"><h1>Editar aulas gravadas</h1><div class="psub">Monte os módulos e as aulas em vídeo — vale para todos os mentorados</div></div><div id="courseEditRoot"><div class="loading">Carregando…</div></div>';
  await loadCourse(); _courseEdit=JSON.parse(JSON.stringify(COURSE||{modulos:[]})); if(!_courseEdit.modulos)_courseEdit.modulos=[]; paintCourseEditor();
}
function courseNewId(pfx){ return pfx+Math.random().toString(36).slice(2,8)+(Date.now()%100000); }
function paintCourseEditor(){
  const root=document.getElementById("courseEditRoot"); if(!root) return;
  const mods=_courseEdit.modulos||[];
  const body=mods.map((m,mi)=>{
    const lessons=(m.aulas||[]).map((a,li)=>(
      '<div class="ck-lesson"><div class="ck-lrow">'
      +'<input class="ck-f" data-ck="lf" data-mi="'+mi+'" data-li="'+li+'" data-f="titulo" placeholder="Título da aula" value="'+esc(a.titulo||'')+'">'
      +'<input class="ck-f" style="max-width:140px" data-ck="lf" data-mi="'+mi+'" data-li="'+li+'" data-f="dur" placeholder="Duração (12:34)" value="'+esc(a.dur||'')+'">'
      +'<button class="ck-x" data-ck="ldel" data-mi="'+mi+'" data-li="'+li+'" title="Remover aula">🗑</button></div>'
      +'<input class="ck-f" data-ck="lf" data-mi="'+mi+'" data-li="'+li+'" data-f="vimeo" placeholder="Link ou ID do Vimeo — ex.: https://vimeo.com/123456789" value="'+esc(a.vimeo||'')+'">'
      +'<div class="ck-hint">Cole o link do Vimeo ou só o número do ID. Vídeo privado/oculto: cole o link completo (com o código depois da barra).</div>'
      +'<textarea class="ck-f" data-ck="lf" data-mi="'+mi+'" data-li="'+li+'" data-f="desc" placeholder="Descrição da aula (opcional)">'+esc(a.desc||'')+'</textarea>'
      +'</div>'
    )).join('');
    return '<div class="ck-mod"><div class="ck-modhd">'
      +'<input class="ck-f" style="font-weight:800;margin-top:0" data-ck="mf" data-mi="'+mi+'" data-f="titulo" placeholder="Título do módulo (ex.: Módulo 1 — Fundamentos)" value="'+esc(m.titulo||'')+'">'
      +'<button class="ck-x" data-ck="mup" data-mi="'+mi+'" title="Subir módulo">↑</button>'
      +'<button class="ck-x" data-ck="mdown" data-mi="'+mi+'" title="Descer módulo">↓</button>'
      +'<button class="ck-x" data-ck="mdel" data-mi="'+mi+'" title="Remover módulo">🗑</button></div>'
      +'<input class="ck-f" data-ck="mf" data-mi="'+mi+'" data-f="desc" placeholder="Descrição curta do módulo (opcional)" value="'+esc(m.desc||'')+'">'
      +lessons
      +'<button class="okr-addobj" style="margin-top:11px" data-ck="ladd" data-mi="'+mi+'">+ Adicionar aula</button></div>';
  }).join('');
  root.innerHTML=
    '<div class="note" style="margin:0 0 16px;color:var(--text-muted)">Estas aulas são <b>globais</b>: aparecem iguais para todos os mentorados (aqui e na aba do portal). As alterações valem para todos.</div>'
    +(body||'<div style="color:var(--text-faint);font-size:13.5px;margin-bottom:10px">Nenhum módulo ainda. Clique abaixo para criar o primeiro.</div>')
    +'<button class="okr-addobj" data-ck="madd">+ Adicionar módulo</button>'
    +'<div class="save-bar"><button data-ck="csave">Salvar aulas</button><button class="tb-btn" data-ck="cback" style="padding:13px 20px">Ver como aluno</button><span id="ckMsg" class="save-msg"></span></div>';
}
async function saveCourse(){
  const msg=document.getElementById("ckMsg"), btn=document.querySelector('[data-ck="csave"]');
  const s=await validToken();
  if(!s || s.email!==MENTOR_EMAIL){ if(msg){msg.textContent="Só o mentor pode salvar as aulas.";msg.className="save-msg err";} return; }
  if(msg){msg.textContent="";} if(btn){btn.disabled=true;btn.textContent="Salvando...";}
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/course?on_conflict=id",{ method:"POST",
      headers:{ "apikey":SUPABASE_ANON_KEY, "Authorization":"Bearer "+s.access_token, "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify({ id:1, data:_courseEdit, updated_at:new Date().toISOString() }) });
    if(!r.ok){ const t=await r.text(); throw new Error("HTTP "+r.status+" "+t.slice(0,140)); }
    COURSE=JSON.parse(JSON.stringify(_courseEdit)); if(!COURSE.modulos)COURSE.modulos=[];
    if(msg){msg.textContent="Aulas salvas! Já valem para todos os mentorados.";msg.className="save-msg ok";}
    if(btn){btn.disabled=false;btn.textContent="Salvar aulas";}
  }catch(e){ if(msg){msg.textContent="Erro ao salvar: "+e.message;msg.className="save-msg err";} if(btn){btn.disabled=false;btn.textContent="Salvar aulas";} }
}

// ===== eventos do curso (delegação no #main) =====
document.getElementById("main").addEventListener("click", e=>{
  const p=e.target.closest("[data-course-play]");
  if(p){ const a=p.dataset.coursePlay.split("-"); _courseSel={mi:+a[0],li:+a[1]}; renderCourse(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const t=e.target.closest("[data-course-toggle]");
  if(t){ const id=t.dataset.courseToggle, set=courseGetDone(); const nd=!set.has(id); if(nd)set.add(id); else set.delete(id); courseSetDone(set); t.classList.toggle("done",nd); t.innerHTML=nd?'✓ Assistida':'Marcar como assistida'; courseRefreshDoneUI(); return; }
  const b=e.target.closest("[data-ck]");
  if(b&&_courseEdit){ const a=b.dataset.ck, mi=+b.dataset.mi, li=+b.dataset.li, mods=_courseEdit.modulos;
    if(a==="madd"){ mods.push({id:courseNewId("m"),titulo:"",desc:"",aulas:[]}); paintCourseEditor(); }
    else if(a==="mdel"){ if(confirm("Remover este módulo e todas as suas aulas?")){ mods.splice(mi,1); paintCourseEditor(); } }
    else if(a==="mup"){ if(mi>0){ const x=mods.splice(mi,1)[0]; mods.splice(mi-1,0,x); paintCourseEditor(); } }
    else if(a==="mdown"){ if(mi<mods.length-1){ const x=mods.splice(mi,1)[0]; mods.splice(mi+1,0,x); paintCourseEditor(); } }
    else if(a==="ladd"){ const m=mods[mi]; m.aulas=m.aulas||[]; m.aulas.push({id:courseNewId("l"),titulo:"",vimeo:"",dur:"",desc:""}); paintCourseEditor(); }
    else if(a==="ldel"){ const m=mods[mi]; if(m&&m.aulas){ m.aulas.splice(li,1); paintCourseEditor(); } }
    else if(a==="csave"){ saveCourse(); }
    else if(a==="cback"){ showCurso(); }
  }
});
document.getElementById("main").addEventListener("input", e=>{ const t=e.target; if(!t||!t.dataset||!t.dataset.ck||!_courseEdit) return; const a=t.dataset.ck;
  if(a==="mf"){ const m=_courseEdit.modulos[+t.dataset.mi]; if(m) m[t.dataset.f]=t.value; }
  else if(a==="lf"){ const m=_courseEdit.modulos[+t.dataset.mi], l=m&&m.aulas&&m.aulas[+t.dataset.li]; if(l) l[t.dataset.f]=t.value; } });

// ===== fluxo de tela =====
function showApp(){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");
  document.getElementById("tbUser").textContent = USER_EMAIL||"";
  document.getElementById("editToggle").classList.toggle("hidden", !IS_MENTOR);
  showCurso();
}
function showLogin(){ document.getElementById("appScreen").classList.add("hidden"); document.getElementById("loginScreen").classList.remove("hidden"); }
function doLogout(){ clearSession(); USER_EMAIL=null;_authToken=null;IS_MENTOR=false;COURSE=null; showLogin(); prefillEmailFromQuery(); }

document.getElementById("loginBtn").addEventListener("click", async ()=>{
  const btn=document.getElementById("loginBtn"), err=document.getElementById("loginErr");
  const email=document.getElementById("email").value.trim(), pwd=document.getElementById("password").value;
  if(!email||!pwd){ err.textContent="Preencha e-mail e senha."; err.className="login-err"; return; }
  err.className="login-err hidden"; btn.disabled=true; btn.textContent="Entrando...";
  try{ await login(email,pwd); showApp(); }
  catch(e){ err.textContent=e.message; err.className="login-err"; }
  finally{ btn.disabled=false; btn.textContent="Entrar →"; }
});
document.getElementById("password").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("loginBtn").click(); });
document.getElementById("editToggle").addEventListener("click", showEditor);
document.getElementById("logoutBtn").addEventListener("click", doLogout);

// mudar senha (sem depender de e-mail)
function showLoginPanel(){ document.getElementById("changePanel").classList.add("hidden"); document.getElementById("loginPanel").classList.remove("hidden"); }
function showChangePanel(){ document.getElementById("loginPanel").classList.add("hidden"); document.getElementById("changePanel").classList.remove("hidden"); const e=document.getElementById("email").value; if(e) document.getElementById("chgEmail").value=e; }
document.getElementById("toggleChange").addEventListener("click", showChangePanel);
document.getElementById("toggleBackLogin").addEventListener("click", showLoginPanel);
document.getElementById("chgBtn").addEventListener("click", async ()=>{
  const btn=document.getElementById("chgBtn"), msg=document.getElementById("changeErr");
  const email=document.getElementById("chgEmail").value.trim(), cur=document.getElementById("chgCurrent").value, nw=document.getElementById("chgNew").value, cf=document.getElementById("chgConfirm").value;
  function err(t){ msg.textContent=t; msg.className="login-err"; }
  msg.className="login-err hidden"; msg.textContent="";
  if(!email||!cur||!nw||!cf){ err("Preencha todos os campos."); return; }
  if(nw.length<6){ err("A nova senha precisa ter pelo menos 6 caracteres."); return; }
  if(nw!==cf){ err("A nova senha e a confirmação não batem."); return; }
  if(nw===cur){ err("A nova senha precisa ser diferente da atual."); return; }
  btn.disabled=true; btn.textContent="Salvando...";
  try{
    const r1=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:cur})});
    const j1=await r1.json();
    if(!r1.ok){ throw new Error(j1.error_description || j1.msg || j1.error || "Senha atual incorreta."); }
    const tok=j1.access_token;
    const r2=await fetch(SUPABASE_URL+"/auth/v1/user",{method:"PUT",headers:{apikey:SUPABASE_ANON_KEY,"Authorization":"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify({password:nw})});
    const j2=await r2.json();
    if(!r2.ok){ throw new Error(j2.msg || j2.error_description || j2.message || "Não foi possível atualizar a senha."); }
    try{ await fetch(SUPABASE_URL+"/auth/v1/logout",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,"Authorization":"Bearer "+tok}}); }catch(e){}
    document.getElementById("chgCurrent").value=""; document.getElementById("chgNew").value=""; document.getElementById("chgConfirm").value="";
    showLoginPanel();
    const le=document.getElementById("loginErr"); le.textContent="Senha alterada! Entre com a nova senha."; le.className="login-err ok";
    document.getElementById("email").value=email;
    setTimeout(()=>document.getElementById("password").focus(), 80);
  }catch(e){ err(e.message||"Erro ao alterar a senha."); }
  finally{ btn.disabled=false; btn.textContent="Salvar nova senha"; }
});
document.getElementById("chgConfirm").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("chgBtn").click(); });

// ===== init =====
(async ()=>{
  if(await trySsoFromHash()){ showApp(); return; }
  const s = await validToken();
  if(s){ showApp(); return; }
  showLogin();
  prefillEmailFromQuery();
})();
</script>
